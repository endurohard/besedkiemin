[general]
static=yes
writeprotect=no

[globals]

[from-internal]
; Звонки между внутренними абонентами
exten => _77XX,1,NoOp(Call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Тестовый эхо-тест
exten => 1000,1,NoOp(Echo Test)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Исходящие звонки через Yeastar (любые номера, не начинающиеся с 77)
exten => _X.,1,NoOp(Outbound call to ${EXTEN} via Yeastar)
 same => n,Set(CALLERID(num)=7779)
 same => n,Dial(PJSIP/${EXTEN}@yeastar-trunk,60)
 same => n,Hangup()

; Голосовая почта (опционально)
exten => *97,1,NoOp(Voicemail)
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; Контекст для входящих звонков от Yeastar
[from-yeastar]
; Входящие звонки направляем на внутренний номер 7779 (менеджер)
exten => 7779,1,NoOp(Incoming call from Yeastar to ${EXTEN})
 same => n,Dial(PJSIP/7779,30)
 same => n,Hangup()

; Если звонят на другие номера, тоже направляем на менеджера
exten => _X.,1,NoOp(Incoming call from Yeastar)
 same => n,Dial(PJSIP/7779,30)
 same => n,Hangup()
