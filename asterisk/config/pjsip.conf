;================================ TRUNK TO YEASTAR ==
; Исходящий транк к Yeastar
[yeastar-trunk]
type=endpoint
context=from-yeastar
transport=transport-udp
aors=yeastar-trunk
auth=yeastar-trunk
outbound_auth=yeastar-trunk
disallow=all
allow=ulaw
allow=alaw
allow=gsm
from_user=7779
from_domain=www.it005.ru

[yeastar-trunk](auth_userpass)
username=7779
password=90PQchO8DxW

[yeastar-trunk]
type=aor
contact=sip:7779@www.it005.ru:5060
qualify_frequency=60

; Исходящая аутентификация
[yeastar-trunk]
type=identify
endpoint=yeastar-trunk
match=www.it005.ru

; Регистрация на Yeastar сервере
[yeastar-registration]
type=registration
transport=transport-udp
outbound_auth=yeastar-trunk
server_uri=sip:www.it005.ru:5060
client_uri=sip:7779@www.it005.ru
retry_interval=60
forbidden_retry_interval=600
expiration=3600
