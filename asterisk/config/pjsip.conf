;================================ TRANSPORTS ==
; Обычный UDP транспорт для SIP (для Yeastar trunk)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=localhost
external_signaling_address=localhost

; WebSocket транспорт для WebRTC (через HTTP сервер на 8088)
; Примечание: WebRTC клиенты подключаются через ws://localhost:8088/ws
; Это работает через модуль res_http_websocket, а не через PJSIP transport

;================================ TEMPLATES ==
; Шаблон для WebRTC клиентов
[webrtc_client](!)
type=endpoint
context=from-internal
disallow=all
allow=opus
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes
; Включаем ICE для NAT traversal
ice_support=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; Шаблон для аутентификации
[auth_userpass](!)
type=auth
auth_type=userpass

; Шаблон для AOR
[aor_single](!)
type=aor
max_contacts=1
remove_existing=yes

