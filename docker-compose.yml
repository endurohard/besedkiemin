version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: besedki_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: besedki_emin
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: besedki_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/besedki_emin?schema=public
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_EXPIRATION: 7d
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: besedki_frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: besedki_asterisk
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./asterisk/config:/etc/asterisk
      - asterisk_logs:/var/log/asterisk
      - asterisk_spool:/var/spool/asterisk
    environment:
      - TZ=Europe/Moscow

volumes:
  postgres_data:
  asterisk_logs:
  asterisk_spool:
