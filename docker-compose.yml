services:
  # Application Database
  postgres:
    image: postgres:16-alpine
    container_name: besedki_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: besedki_emin
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - besedki-network

  # Kong API Gateway (DB-less mode with declarative config)
  kong:
    image: kong:3.4
    container_name: kong_gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_PROXY_LISTEN: '0.0.0.0:80, 0.0.0.0:443 ssl'
    ports:
      - '80:80'     # HTTP на стандартном порту (без :8000 в URL)
      - '443:443'   # HTTPS на стандартном порту
      - '8001:8001' # Kong Admin API (read-only in DB-less mode)
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml:ro
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - besedki-network

  # Backend API
  backend:
    image: node:18
    container_name: besedki_backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && chmod +x node_modules/.bin/* && npm run start:dev"
    expose:
      - '3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/besedki_emin?schema=public
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_EXPIRATION: 7d
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - besedki-network

  # Frontend
  frontend:
    image: node:18
    container_name: besedki_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run build && node server.cjs"
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: /api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - besedki-network

  # asterisk:
  #   build:
  #     context: ./asterisk
  #     dockerfile: Dockerfile
  #   container_name: besedki_asterisk
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./asterisk/config:/etc/asterisk
  #     - asterisk_logs:/var/log/asterisk
  #     - asterisk_spool:/var/spool/asterisk
  #   environment:
  #     - TZ=Europe/Moscow

volumes:
  postgres_data:
  asterisk_logs:
  asterisk_spool:

networks:
  besedki-network:
    driver: bridge
